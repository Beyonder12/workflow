

# Set Special Network
networks:
  default:
    external: true
    name: kogito

services:
  # 1. DB Postgresql
  postgres:
    image: postgres:13.4-alpine3.14
    container_name: postgres
    restart: always
    ports:
      - "54325:5432"
    volumes:
      - "./config/sql/:/docker-entrypoint-initdb.d/"      
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "myservice", "-U", "myservice-user" ]
      timeout: 45s
      interval: 10s
      retries: 50
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password09
    # networks:
    #   - kogito

  # 2. Zookeeper
  zookeeper:
    container_name: zookeeper
    image: strimzi/kafka:0.20.1-kafka-2.6.0
    restart: always
    command: [
      "sh", "-c",
      "bin/zookeeper-server-start.sh config/zookeeper.properties"
    ]
    ports:
      - "2181:2181"
    environment:
      LOG_DIR: "/tmp/logs"
    # networks:
    #   - kogito


  # 3. Kafka
  kafka:
    image: strimzi/kafka:0.20.1-kafka-2.6.0
    restart: always
    container_name: kafka    
    command: [
      "sh", "-c",
      "bin/kafka-server-start.sh config/server.properties --override inter.broker.listener.name=$${KAFKA_INTER_BROKER_LISTENER_NAME} --override listener.security.protocol.map=$${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP} --override listeners=$${KAFKA_LISTENERS} --override advertised.listeners=$${KAFKA_ADVERTISED_LISTENERS} --override zookeeper.connect=$${KAFKA_ZOOKEEPER_CONNECT}"
    ]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      LOG_DIR: "/tmp/logs"
    # networks:
    #   - kogito

  # 4. Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: always
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=my-kafka-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER_CONNECT=zookeeper:2181
    # networks:
    #   - kogito

  # 5. Keycloak
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:legacy
    restart: always
    ports:
      - "8480:8080"
    volumes:
      - ./config/keycloak/kogito-realm.json:/tmp/kogito-realm.json
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/auth/realms/kogito" ]
      interval: 10s
      timeout: 1s
      retries: 50
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      DB_USER: myservice-user
      DB_SCHEMA: public
      DB_PASSWORD: myservice-pass
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_IMPORT: /tmp/kogito-realm.json
    depends_on:
      - postgres
    # networks:
    #   - kogito
  
  # 6. Data Index Kogito
  dataindex:
    container_name: dataindex
    image: quay.io/kiegroup/kogito-data-index-postgresql:1.44.1
    restart: always
    ports:
      - "8180:8080"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/dataindex"
      QUARKUS_DATASOURCE_USERNAME: myservice-user
      QUARKUS_DATASOURCE_PASSWORD: myservice-pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QUARKUS_HTTP_CORS_ORIGINS: "/.*/"
      KOGITO_DATA_INDEX_PROPS: -Dquarkus.hibernate-orm.database.generation=update
    # networks:
    #   - kogito

  # 7. Management Kogito
  managementconsole:
    container_name: managementconsole
    image: quay.io/kiegroup/kogito-management-console:1.44.1
    restart: always
    ports:
      - 8280:8080
    depends_on:
      dataindex:
        condition: service_started
      keycloak:
        condition: service_healthy
    # volumes:
    #   - "./config/svg/:/home/kogito/data/svg/"    
    environment:
      KOGITO_DATAINDEX_HTTP_URL: http://localhost:8180/graphql
      KOGITO_DATAINDEX_WS_URL: ws://localhost:8180/graphql
      QUARKUS_HTTP_CORS_ORIGINS: "/.*/"
      KOGITO_MANAGEMENT_CONSOLE_PROPS: -Dkogito.consoles.keycloak.config.url=http://localhost:8480/auth -Dkogito.consoles.keycloak.config.health-check-url=http://localhost:8480/auth/realms/kogito/.well-known/openid-configuration -Dkogito.svg.folder.path=/home/kogito/data/svg
      KOGITO_MANAGEMENT_CONSOLE_PROCESSES_SVG_ENDPOINT_ENABLED: true
      KOGITO_SVG_FOLDER_PATH: /home/kogito/data/svg
      JAVA_OPTS: /home/kogito/data/svg
    # networks:
    #   - kogito

  # 8. Task Console
  taskconsole:
    container_name: taskconsole
    image: quay.io/kiegroup/kogito-task-console:1.44.1
    restart: always
    ports:
      - 8380:8080
    depends_on:
      dataindex:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      KOGITO_DATAINDEX_HTTP_URL: http://localhost:8180/graphql
      QUARKUS_HTTP_CORS_ORIGINS: "/.*/"
      KOGITO_TASK_CONSOLE_PROPS: -Dkogito.consoles.keycloak.config.url=http://localhost:8480/auth -Dkogito.consoles.keycloak.config.health-check-url=http://localhost:8480/auth/realms/kogito/.well-known/openid-configuration
    # networks:
    #   - kogito

  myservice:
    container_name: myservice
    build:
      context: ..
      dockerfile: ./src/main/docker/Dockerfile.jvm
    image: myservice:latest
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/myservice"
      QUARKUS_DATASOURCE_USERNAME: myservice-user
      QUARKUS_DATASOURCE_PASSWORD: myservice-pass
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KOGITO_SERVICE_URL: http://myservice:8080
      KOGITO_DATAINDEX_HTTP_URL: http://dataindex:8080/graphql
      QUARKUS_FLYWAY_BASELINE_ON_MIGRATE: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "/.*/"
    # networks:
    #   - kogito